<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyOrder Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #orderForm {
      display: none;
      margin-top: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="product">

    <h1>Tattoo T-shirt</h1>

    <p>Тестовый товар для EasyOrder</p>

    <h2>$25</h2>

    <button onclick="showOrderForm()">
      Купить
    </button>

    <div id="orderForm">

      <input id="name" type="text" placeholder="Ваше имя">

      <input id="phone" type="tel" placeholder="Телефон">

      <input id="email" type="email" placeholder="Email">

      <input id="quantity" type="number" value="1" min="1">

      <button onclick="sendOrder()">
        Оформить заказ
      </button>

      <div id="result"></div>

    </div>

  </div>


<script>

function showOrderForm() {
  document.getElementById("orderForm").style.display = "block";
}


async function sendOrder() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const quantity = Number(document.getElementById("quantity").value);

  const product = "Tattoo T-shirt";
  const price = 25;

  if (!name || !phone) {
    document.getElementById("result").textContent =
      "Введите имя и телефон";
    return;
  }

  const order = {
    product: product,
    price: price,
    quantity: quantity,
    total: price * quantity,
    name: name,
    phone: phone,
    email: email
  };


  try {

    const response = await fetch(
      "https://easyorder.netw20200.workers.dev/",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(order)
      }
    );


    const data = await response.json();

    console.log(data);

    if (data.success) {

      document.getElementById("result").textContent =
        "✅ Заказ принят!";

      console.log("Полученный заказ:", data.order);

    } else {

      document.getElementById("result").textContent =
        "❌ Ошибка отправки";

    }

  } catch (error) {

    console.error(error);

    document.getElementById("result").textContent =
      "❌ Не удалось связаться с сервером";

  }

}

</script>
<script src="easyorder.js"></script>
</body>
</html>
